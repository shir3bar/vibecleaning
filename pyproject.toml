[project]
name = "vibecleaning"
version = "0.1.0"
description = "Local data-cleaning apps backed by a reproducible dataset DAG"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi",
  "numpy",
  "osmium",
  "pandas",
  "rdata>=1.1,<2",
  "scikit-learn",
  "shapely",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx",
  "ipykernel",
  "pytest",
]

[tool.uv]
package = false
