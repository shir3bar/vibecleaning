<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="vibecleaning-movement-mode" content="slim_movement">
<title>vibecleaning · slim movement</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤙</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --panel: rgba(8, 17, 27, 0.92);
    --border: rgba(148, 163, 184, 0.18);
    --text: #e8eef7;
    --muted: #92a4bd;
    --accent: #52d6b5;
    --danger: #ff9b9b;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(33, 107, 105, 0.24), transparent 36rem),
      linear-gradient(180deg, #09111a 0%, #050911 100%);
    color: var(--text);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  #login-view {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-card {
    width: min(100%, 390px);
    padding: 30px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
  }
  .login-brand {
    font: 700 22px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: 0.03em;
    text-transform: lowercase;
  }
  .login-kicker {
    margin-top: 7px;
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .login-copy {
    margin: 22px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }
  .login-field {
    display: grid;
    gap: 7px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .login-field input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 8px;
    outline: none;
    background: rgba(2, 8, 15, 0.76);
    color: var(--text);
    font: inherit;
    text-transform: none;
  }
  .login-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(82, 214, 181, 0.12);
  }
  .login-submit {
    width: 100%;
    margin-top: 20px;
    padding: 11px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #06211b;
    cursor: pointer;
    font-weight: 750;
  }
  .login-submit:disabled { cursor: wait; opacity: 0.62; }
  .login-status {
    min-height: 20px;
    margin-top: 12px;
    color: var(--danger);
    font-size: 13px;
    line-height: 1.4;
  }
  #app-shell { height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font: 700 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: 0.03em;
    text-transform: lowercase;
  }
  .brand span {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    min-width: 0;
  }
  .topbar .movement-edit-lock.hidden {
    display: none;
  }
  .review-controls { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
  .review-controls button { padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; }
  .auth-identity, .review-progress { color: var(--muted); font-size: 12px; }
  .logout-button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .logout-button:hover { border-color: rgba(148, 163, 184, 0.4); color: var(--text); }
  #app { flex: 1; min-height: 0; }
</style>
</head>
<body>
<section id="login-view" aria-labelledby="login-title">
  <form id="login-form" class="login-card">
    <h1 id="login-title" class="login-brand">vibecleaning</h1>
    <div class="login-kicker">slim movement review</div>
    <p class="login-copy">Log in with the account provided by the application operator.</p>
    <label class="login-field">
      Username
      <input id="login-username" name="username" autocomplete="username" required>
    </label>
    <label class="login-field">
      Password
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button id="login-submit" class="login-submit" type="submit">Log in</button>
    <p id="login-status" class="login-status" role="alert" aria-live="polite"></p>
  </form>
</section>

<div id="app-shell" hidden>
  <header class="topbar">
    <div class="brand">
      <h1>vibecleaning</h1>
      <span>slim movement review</span>
    </div>
    <div class="topbar-actions">
      <div class="review-controls">
        <span class="auth-identity" data-role="auth-identity"></span>
        <span class="review-progress" data-role="review-progress"></span>
        <button type="button" data-role="assign-review" hidden>Assign review</button>
        <button type="button" data-role="complete-review" hidden>Complete review</button>
        <button type="button" data-role="cancel-review" hidden>Cancel review</button>
        <button type="button" data-role="editor-control-start" hidden>Start editor control</button>
        <button type="button" data-role="editor-control-finish" hidden>Finish editor control</button>
      </div>
      <div class="movement-edit-lock hidden" data-role="edit-lock-profile">
        <span class="movement-edit-lock-badge">Read-only</span>
        <span class="movement-edit-lock-message" data-role="edit-lock-message"></span>
        <button type="button" data-role="resume-history">Resume</button>
      </div>
      <button id="logout-button" class="logout-button" type="button">Log out</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script type="module" src="/slim-static/login.js"></script>
</body>
</html>
